<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6fed'/%3E%3Cpath d='M25 17v30l24-15z' fill='%23fff'/%3E%3C/svg%3E">
<title>摩奇拉儿歌 · 播放器</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f4f6f8; --card:#fff; --line:#e4e8ec; --tx:#16191d; --tx2:#5a636d; --tx3:#8b949e;
  --ac:#0b6bcb; --ac2:#38a3f1; --bar:76px;
}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif;padding-bottom:var(--bar)}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
header{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.hd{display:flex;align-items:center;gap:18px;padding:14px 20px;max-width:1240px;margin:0 auto}
.logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-size:20px;flex:none;box-shadow:0 4px 12px rgba(11,107,203,.25)}
.tt h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
.tt p{margin:2px 0 0;font-size:12px;color:var(--tx3)}
.sp{flex:1}
.search{position:relative;flex:0 1 300px;min-width:150px}
.search input{width:100%;padding:9px 13px 9px 34px;border:1px solid var(--line);border-radius:9px;background:#f7f9fa;font-size:13px;color:var(--tx);outline:none;transition:.15s}
.search input:focus{border-color:var(--ac);background:#fff;box-shadow:0 0 0 3px rgba(11,107,203,.1)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.42;pointer-events:none}
.btn{border:1px solid var(--line);background:#fff;padding:9px 15px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--tx2);transition:.15s;font-family:inherit;white-space:nowrap}
.btn:hover{border-color:var(--ac);color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.pri:hover{background:#095ab0;color:#fff}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.st{background:#f7f9fa;border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:12px;color:var(--tx2)}
.st b{color:var(--ac);font-size:14px;margin-right:3px}
main{display:flex;gap:18px;align-items:flex-start;padding:20px 0 30px}
aside{width:252px;flex:none;position:sticky;top:86px;max-height:calc(100vh - 120px);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.aside-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.aside-h b{font-size:13px;flex:1}
.alist{overflow-y:auto;flex:1}
.alist::-webkit-scrollbar{width:7px}
.alist::-webkit-scrollbar-thumb{background:#d6dce2;border-radius:4px}
.al{display:flex;align-items:center;gap:8px;padding:9px 14px;cursor:pointer;border-left:3px solid transparent;transition:.12s}
.al:hover{background:#f6f9fc}
.al.on{background:#eaf3fd;border-left-color:var(--ac)}
.al .nm{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.al.on .nm{color:var(--ac);font-weight:600}
.al .ct{font-size:11px;color:var(--tx3);background:#f0f3f6;border-radius:20px;padding:1px 7px;flex:none}
.al.on .ct{background:#d3e7fb;color:var(--ac)}
.section{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sh h2{margin:0;font-size:15px;font-weight:650}
.sh .sub{font-size:12px;color:var(--tx3)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--tx3);font-weight:600;text-align:left;padding:9px 14px;background:#fafbfc;border-bottom:1px solid var(--line);position:sticky;top:0}
th.n{width:46px} th.a{width:170px} th.d{width:80px;text-align:right}
td{padding:8px 14px;border-bottom:1px solid #f2f4f6;font-size:13px}
tr.r{cursor:pointer;transition:.1s}
tr.r:hover td{background:#f7fafd}
tr.r.on td{background:#eaf3fd}
tr.r.on td.nm{color:var(--ac);font-weight:600}
td.n{color:var(--tx3);font-size:12px}
td.nm{font-weight:500}
td.ar{color:var(--tx2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
td.d{text-align:right;color:var(--tx3);font-size:12px;font-variant-numeric:tabular-nums}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:13px;vertical-align:middle}
.eq i{width:3px;background:var(--ac);border-radius:1px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(1){height:5px;animation-delay:0s}
.eq i:nth-child(2){height:11px;animation-delay:.2s}
.eq i:nth-child(3){height:7px;animation-delay:.4s}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.ico{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--tx2);transition:.15s;margin-right:4px}
.ico:hover{border-color:var(--ac);color:var(--ac)}
.ico.playing{background:var(--ac);border-color:var(--ac);color:#fff}
.empty{padding:50px 20px;text-align:center;color:var(--tx3);font-size:13px}
footer{padding:20px 0 30px;color:var(--tx3);font-size:12px;text-align:center;line-height:1.9}
code{background:#eceff2;padding:2px 7px;border-radius:4px;font-size:11.5px;color:#454c54}
/* 播放条 */
#bar{position:fixed;left:0;right:0;bottom:0;height:var(--bar);background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);box-shadow:0 -3px 18px rgba(0,0,0,.06);z-index:50;display:flex;align-items:center}
#bar .wrap{display:flex;align-items:center;gap:14px;width:100%;max-width:1240px}
.np{display:flex;align-items:center;gap:11px;width:290px;flex:none;min-width:0}
.np .art{width:46px;height:46px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-size:19px;flex:none}
.np .meta{min-width:0}
.np .tt{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .al{font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctr{display:flex;align-items:center;gap:8px;flex:none}
.pb{width:38px;height:38px;border-radius:50%;border:none;background:var(--ac);color:#fff;cursor:pointer;display:grid;place-items:center;transition:.15s;box-shadow:0 3px 10px rgba(11,107,203,.3)}
.pb:hover{background:#095ab0;transform:scale(1.05)}
.sb{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--tx2);cursor:pointer;display:grid;place-items:center;transition:.15s}
.sb:hover{border-color:var(--ac);color:var(--ac)}
.sb.on{background:var(--ac);border-color:var(--ac);color:#fff}
.seek{flex:1;display:flex;align-items:center;gap:10px;min-width:100px}
.tm{font-size:11.5px;color:var(--tx3);font-variant-numeric:tabular-nums;flex:none;min-width:38px}
.tm.r{text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;background:#dfe4e9;outline:none;cursor:pointer;flex:1;min-width:60px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--ac);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:var(--ac);cursor:pointer}
.vol{width:80px;flex:none}
/* ========== 响应式适配 ========== */
/* 平板：侧栏改为横向专辑条 */
@media(max-width:860px){
  main{flex-direction:column;align-items:stretch}
  aside{width:100%;position:static;max-height:210px}
  .section{flex:0 0 auto}   /* column 布局下重置桌面端的 flex:1 */
  th.a,.al{display:none}
  td.ar{display:none}   /* 表头与数据列必须同步隐藏，否则列错位 */
  .np{width:150px}
  .vol{display:none}
  /* 页头在窄屏下同样会挤压标题，先做基础换行 */
  .hd{flex-wrap:wrap;gap:12px 14px}
  .tt{min-width:0}
  .tt h1,.tt p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}

/* 手机：页头改为两行堆叠，消除横向溢出 */
@media(max-width:640px){
  :root{--bar:132px}
  body{padding-bottom:var(--bar)}

  /* 页头：允许换行，标题区独占一行且不被挤压 */
  .hd{flex-wrap:wrap;gap:10px 12px;padding:12px 14px}
  .logo{width:36px;height:36px;border-radius:9px;font-size:17px}
  .tt{flex:1 1 auto;min-width:0}
  .tt h1{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tt p{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sp{display:none}

  /* 统计条：横向铺满一行 */
  .stats{order:3;flex:1 1 100%;gap:6px}
  .st{flex:1;text-align:center;padding:6px 8px;font-size:11px}

  /* 搜索框与按钮：各占整行，不再被截断 */
  .search{order:4;flex:1 1 100%;min-width:0}
  .search input{padding:10px 13px 10px 34px;font-size:16px} /* 16px 防 iOS 聚焦缩放 */
  .btn.pri{order:5;flex:1 1 100%;padding:11px 15px;font-size:14px}

  /* 专辑栏：横向滑动条，不再吃掉大片竖向空间 */
  aside{max-height:none;display:block}
  .aside-h{padding:10px 14px;border-bottom:1px solid var(--line)}
  .aside-h::after{content:"← 左右滑动 →";font-size:11px;color:var(--tx3);flex:none;font-weight:400}
  .alist{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;gap:8px;padding:10px 14px;max-height:none;flex:none;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-snap-type:x proximity;
    -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 26px),transparent 100%);
    mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 26px),transparent 100%)}
  .alist::-webkit-scrollbar{display:none}
  .alist .al{flex:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;margin:0;padding:7px 12px;border:1px solid var(--line);border-left-width:1px;border-radius:20px;background:#fff;scroll-snap-align:start}
  .alist .al.on{border-color:var(--ac);border-left-color:var(--ac);background:#eaf3fd}
  .alist .al .nm{flex:none;font-size:12.5px;max-width:150px}
  .alist .al .ct{font-size:10.5px;padding:1px 6px}

  /* 主区两栏改为纵向时收紧间距；
     align-items 需从 flex-start 改为 stretch，否则 aside 与 section 会重叠 */
  main{flex-direction:column;align-items:stretch;gap:12px;padding:14px 0 20px}

  /* 曲目表：隐藏歌手列，压缩内边距 */
  .wrap{padding:0 12px}
  /* 移动端改用普通块级流：超长表格在 flex column 容器里会被顶破并与 aside 重叠 */
  main{display:block;padding:14px 0 20px}
  aside{margin-bottom:12px}
  .section{border-radius:10px}
  .sh{padding:11px 14px}
  .sh h2{font-size:14px}
  th,td{padding:8px 10px}
  th.n{width:32px}
  td.nm{font-size:13px}
  .eq{display:none}

  /* 播放条：三层（信息 / 控制 / 进度），大按钮不误触 */
  #bar{height:auto;padding:8px 0 10px}
  #bar .wrap{flex-wrap:wrap;gap:8px;padding:0 12px}
  .np{order:1;width:auto;flex:1 1 100%;min-width:0;gap:9px}
  .np .art{width:36px;height:36px;font-size:15px;border-radius:7px}
  .np .tt{font-size:12.5px}
  .np .al{font-size:11px}
  .ctr{order:2;flex:0 1 auto;gap:10px;justify-content:center}
  .pb{width:44px;height:44px}
  .sb{width:34px;height:34px}
  /* 静音按钮并入控制行（它在 DOM 里位于 .seek 之后，需显式定序） */
  #bar #mute{order:2;margin-left:auto;align-self:center}
  .vol{display:none}

  /* 进度条独占一行 */
  .seek{order:3;flex:1 1 100%;gap:8px}
  .tm{font-size:11px;min-width:34px}
  input[type=range]{min-width:0}
  input[type=range]::-webkit-slider-thumb{width:17px;height:17px}  /* 触摸目标放大 */
}

/* 超窄屏（iPhone SE 等 320px 级） */
@media(max-width:360px){
  .tt h1{font-size:15px}
  .tt p{display:none}
  .stats .st{font-size:10px;padding:5px 6px}
  .np .art{display:none}
  .ctr{gap:4px}
  .sb{width:28px;height:28px}
  .sb#rep{display:none}
}

/* 触摸设备：加大可点击区域 */
@media(hover:none) and (pointer:coarse){
  .sb{width:36px;height:36px}
  .pb{width:44px;height:44px}
  .ico{width:32px;height:32px}
  .btn{padding:11px 16px}
  tr.r td{padding:11px 10px}
}
</style></head>
<body>
<header><div class="hd">
  <div class="logo">&#9835;</div>
  <div class="tt"><h1>摩奇拉儿歌 · 播放器</h1><p>通力时代 Mokila IP · 432 首 · 48 专辑 · 本地离线播放</p></div>
  <div class="sp"></div>
  <div class="stats">
    <span class="st"><b id="s1">0</b>首</span>
    <span class="st"><b id="s2">0</b>小时</span>
    <span class="st"><b id="s3">0</b>专辑</span>
  </div>
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" placeholder="搜索歌名 / 专辑 / 歌手">
  </div>
  <button class="btn pri" id="playAll">&#9654;&nbsp; 播放全部</button>
</div></header>

<main class="wrap">
  <aside>
    <div class="aside-h"><b>专辑 / 分类</b><button class="btn" id="clr" style="padding:4px 10px;font-size:12px">全部</button></div>
    <div class="alist" id="alist"></div>
  </aside>
  <section class="section">
    <div class="sh">
      <h2 id="ttl">全部曲目</h2>
      <span class="sub" id="sub"></span>
      <div class="sp"></div>
      <button class="btn" id="shuf">&#128256; 随机播放</button>
    </div>
    <table>
      <thead><tr><th class="n">#</th><th>曲目</th><th class="a">歌手</th><th class="d">时长</th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
    <div class="empty" id="emp" style="display:none">没有匹配的曲目</div>
  </section>
</main>

<footer class="wrap">
  音频文件位于 <code>摩奇拉儿歌/</code> 目录 · 需与本页面保持相对位置 · 共 <b id="f1">0</b> 个文件<br>
  快捷键：<code>空格</code> 播放/暂停 · <code>← →</code> 上一首/下一首 · <code>↑ ↓</code> 音量 · <code>M</code> 静音
</footer>

<div id="bar"><div class="wrap">
  <div class="np">
    <div class="art" id="art">&#9835;</div>
    <div class="meta"><div class="tt" id="npt">未在播放</div><div class="al" id="npa">选择一首开始</div></div>
  </div>
  <div class="ctr">
    <button class="sb" id="prev" title="上一首"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2.5v14H6zM20 5v14L9.5 12z"/></svg></button>
    <button class="pb" id="play" title="播放/暂停"><svg id="pico" width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></button>
    <button class="sb" id="next" title="下一首"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 5H18v14h-2.5zM4 5v14l10.5-7z"/></svg></button>
    <button class="sb" id="rep" title="循环模式"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg></button>
  </div>
  <div class="seek">
    <span class="tm" id="cur">0:00</span>
    <input type="range" id="prog" value="0" min="0" max="1000" step="1">
    <span class="tm r" id="dur">0:00</span>
  </div>
  <button class="sb" id="mute" title="静音"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9zm12.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4z"/></svg></button>
  <input type="range" class="vol" id="vol" min="0" max="100" value="80">
</div></div>

const T=DATA.tracks, AL=DATA.albums;
let view=[], cur=-1, mode=0, shuffle=false, raf=0;

/* ---- 统计 ---- */
const fmtH=s=>{const h=Math.floor(s/3600),m=Math.round(s%3600/60);return h?h+'小时'+(m?m+'分':''):m+'分';};
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
document.getElementById('s1').textContent=T.length;
document.getElementById('s2').textContent=(T.reduce((a,b)=>a+b.d,0)/3600).toFixed(1);
document.getElementById('s3').textContent=Object.keys(AL).length;
document.getElementById('f1').textContent=T.length;

/* ---- 专辑侧栏 ---- */
const alist=document.getElementById('alist');
const alistOrder=Object.entries(AL).sort((a,b)=>b[1]-a[1]);
alistOrder.forEach(([name,n])=>{
  const d=document.createElement('div');
  d.className='al'; d.dataset.al=name; d.title=name;
  d.innerHTML='<span class="nm">'+name.replace(/</g,'&lt;')+'</span><span class="ct">'+n+'</span>';
  d.onclick=()=>{ sel=(sel===name?null:name); render(); };
  alist.appendChild(d);
});
let sel=null;

/* ---- 渲染 ---- */
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  view=T.filter(t=>{
    if(sel && t.l!==sel) return false;
    if(!q) return true;
    return (t.t+' '+t.l+' '+t.a).toLowerCase().includes(q);
  });
  document.getElementById('ttl').textContent = sel? sel : (q? '搜索结果' : '全部曲目');
  document.getElementById('sub').textContent = view.length+' 首 · '+fmtH(view.reduce((a,b)=>a+b.d,0));
  document.getElementById('emp').style.display = view.length?'none':'block';
  const tb=document.getElementById('tb');
  tb.innerHTML=view.map((t,i)=>{
    const on = view[cur]===t;
    const num = on? '<span class="eq"><i></i><i></i><i></i></span>' : (i+1);
    return '<tr class="r'+(on?' on':'')+'" data-i="'+i+'"><td class="n">'+num+'</td>'+
      '<td class="nm" title="'+t.t.replace(/"/g,'&quot;')+'">'+t.t.replace(/</g,'&lt;')+'</td><td class="ar" title="'+t.a.replace(/"/g,'&quot;')+'">'+t.a.replace(/</g,'&lt;')+'</td>'+
      '<td class="d">'+fmt(t.d)+'</td></tr>';
  }).join('');
  [...document.querySelectorAll('tr.r')].forEach(tr=>{
    tr.onclick=()=>play(+tr.dataset.i);
  });
  [...document.querySelectorAll('.al')].forEach(d=>d.classList.toggle('on',d.dataset.al===sel));
}
document.getElementById('q').oninput=render;
document.getElementById('clr').onclick=()=>{sel=null;document.getElementById('q').value='';render();};
document.getElementById('playAll').onclick=()=>{ if(view.length) play(0); };
document.getElementById('shuf').onclick=()=>{ shuffle=!shuffle; document.getElementById('shuf').classList.toggle('pri',shuffle); if(shuffle&&view.length) play(Math.floor(Math.random()*view.length)); };

/* ---- 播放 ---- */
const au=document.getElementById('au');
const ICO_PLAY='<path d="M7 4.5v15l13-7.5z"/>';
const ICO_PAUSE='<path d="M6 4.5h4v15H6zM14 4.5h4v15h-4z"/>';
function play(i){
  if(i<0||i>=view.length) return;
  cur=i; const t=view[i];
  au.src=encodeURI(t.p);
  au.play().catch(e=>{document.getElementById('npt').textContent='点击播放按钮开始';});
  document.getElementById('npt').textContent=t.t;
  document.getElementById('npa').textContent=t.l+' · '+t.a;
  document.getElementById('dur').textContent=fmt(t.d);
  document.getElementById('play').classList.add('playing');
  document.getElementById('pico').innerHTML=ICO_PAUSE;
  render();
}
function toggle(){ if(cur<0){ if(view.length) play(0); return; } au.paused?au.play():au.pause(); }
function step(d){
  if(!view.length) return;
  let n;
  if(shuffle){ n=Math.floor(Math.random()*view.length); }
  else { n=cur+d; if(n<0) n=view.length-1; if(n>=view.length) n=0; }
  play(n);
}
au.addEventListener('play',()=>{document.getElementById('pico').innerHTML=ICO_PAUSE;});
au.addEventListener('pause',()=>{document.getElementById('pico').innerHTML=ICO_PLAY;});
au.addEventListener('ended',()=>{
  if(mode===1){ play(cur); return; }
  if(mode===2 && cur===view.length-1){ au.currentTime=0; return; }
  step(1);
});
au.addEventListener('loadedmetadata',()=>{
  if(isFinite(au.duration)&&au.duration>0) document.getElementById('dur').textContent=fmt(au.duration);
});
au.addEventListener('timeupdate',()=>{
  if(!au.duration||!isFinite(au.duration)) return;
  document.getElementById('prog').value=Math.round(au.currentTime/au.duration*1000);
  document.getElementById('cur').textContent=fmt(au.currentTime);
});
document.getElementById('prog').oninput=e=>{ if(au.duration) au.currentTime=au.duration*e.target.value/1000; };
document.getElementById('play').onclick=toggle;
document.getElementById('prev').onclick=()=>step(-1);
document.getElementById('next').onclick=()=>step(1);
document.getElementById('rep').onclick=()=>{ mode=(mode+1)%3; document.getElementById('rep').classList.toggle('on',mode>0); document.getElementById('rep').title=['不循环','单曲循环','列表循环'][mode]; };
const vol=document.getElementById('vol');
au.volume=vol.value/100;
vol.oninput=()=>{au.volume=vol.value/100; if(au.volume>0) au.muted=false;};
document.getElementById('mute').onclick=()=>{au.muted=!au.muted;};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.code==='Space'){e.preventDefault();toggle();}
  else if(e.code==='ArrowRight'){step(1);}
  else if(e.code==='ArrowLeft'){step(-1);}
  else if(e.code==='ArrowUp'){e.preventDefault();au.volume=Math.min(1,au.volume+.05);vol.value=au.volume*100;}
  else if(e.code==='ArrowDown'){e.preventDefault();au.volume=Math.max(0,au.volume-.05);vol.value=au.volume*100;}
  else if(e.key==='m'||e.key==='M'){au.muted=!au.muted;}
});
render();
</script>
</body></html>
